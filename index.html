<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingredients MAG H2</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; color:#1a1a2e; }
.hidden { display:none !important; }
#app { max-width:1100px; margin:0 auto; padding:16px; }
#status { text-align:center; padding:8px; border-radius:6px; margin-bottom:12px; font-size:14px; font-weight:600; }
.status-ok { background:#d4edda; color:#155724; }
.status-err { background:#f8d7da; color:#721c24; }
header { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #ddd; margin-bottom:16px; }
header h1 { font-size:20px; color:#1e3a5f; }
.toolbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.toolbar input[type=text] { flex:1; min-width:240px; padding:12px 16px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; outline:none; }
.toolbar input[type=text]:focus { border-color:#1e3a5f; }
.btn { padding:10px 18px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.btn-add { background:#228b22; color:#fff; }
.btn-add:hover { background:#1a6b1a; }
table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
th { background:#1e3a5f; color:#fff; padding:12px 16px; text-align:left; font-size:13px; font-weight:600; cursor:pointer; }
th:hover { background:#2a4a7a; }
td { padding:10px 16px; font-size:14px; border-bottom:1px solid #eef0f3; }
tr:hover td { background:#f6f8fa; }
.clickable { cursor:pointer; color:#1e3a5f; font-weight:500; }
.clickable:hover { text-decoration:underline; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { background:#fff; border-radius:12px; padding:32px; width:90%; max-width:600px; max-height:85vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,0.2); }
.modal h2 { font-size:20px; margin-bottom:20px; color:#1e3a5f; }
.modal label { display:block; font-size:12px; font-weight:600; color:#666; margin-bottom:4px; margin-top:14px; text-transform:uppercase; }
.modal input { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:14px; margin-bottom:4px; }
.modal input:focus { border-color:#1e3a5f; outline:none; }
.modal-actions { display:flex; gap:10px; margin-top:24px; justify-content:flex-end; }
.btn-cancel { background:#6c757d; color:#fff; }
.btn-save { background:#228b22; color:#fff; }
.btn-delete { background:#dc3545; color:#fff; }
.modal .error { color:#dc3545; font-size:13px; margin-top:8px; }

@media(max-width:768px) {
  .toolbar { flex-direction:column; }
  th:nth-child(2), td:nth-child(2) { display:none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="status">Chargement...</div>
  <header>
    <h1>INGREDIENTS MAG H2</h1>
  </header>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Rechercher un ingredient..." disabled>
    <button class="btn btn-add" id="btnAdd" disabled>+ Ajouter</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Designation</th>
        <th>Libelle effectivite</th>
        <th>Prime MPN</th>
        <th>CCN</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="4" style="text-align:center;padding:40px;color:#999;">Chargement des donnees...</td></tr>
    </tbody>
  </table>
</div>
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modalBox"></div>
</div>

<script>
// ══════════════════════════════════════════
// CONFIGURATION - À MODIFIER
// ══════════════════════════════════════════
var GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOmWsMVdJG2UDMna6xbxBLV0clNMY5iJYtgyQ9FrSbhM7WgEJaFjrNVz6_AM-Xe695/exec';

var ingredients = [];
var searchTimeout = null;

function loadData() {
  setStatus('Chargement...', '');
  fetch(GOOGLE_SCRIPT_URL)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      ingredients = data;
      setStatus(ingredients.length + ' ingredients charges', 'ok');
      document.getElementById('searchInput').disabled = false;
      document.getElementById('btnAdd').disabled = false;
      render();
    })
    .catch(function(err) {
      setStatus('Erreur de chargement.', 'err');
      console.error(err);
    });
}

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = type === 'ok' ? 'status-ok' : type === 'err' ? 'status-err' : '';
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function filtered() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  return ingredients.filter(function(i) {
    if (!q) return true;
    return (String(i.designation)).toLowerCase().indexOf(q) !== -1 ||
           (String(i.libelle)).toLowerCase().indexOf(q) !== -1 ||
           (String(i.mpn)).toLowerCase().indexOf(q) !== -1 ||
           (String(i.ccn)).toLowerCase().indexOf(q) !== -1;
  });
}

function render() {
  var list = filtered();
  var tbody = document.getElementById('tableBody');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:#999;">Aucun resultat</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(i) {
    var idx = ingredients.indexOf(i);
    return '<tr>' +
      '<td class="clickable" onclick="openDetail(' + idx + ')">' + esc(i.designation) + '</td>' +
      '<td>' + esc(i.libelle) + '</td>' +
      '<td>' + esc(i.mpn) + '</td>' +
      '<td>' + esc(i.ccn) + '</td>' +
      '</tr>';
  }).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════
// MODAL: DETAIL
// ══════════════════════════════════════════
function openDetail(idx) {
  var i = ingredients[idx];
  document.getElementById('modalBox').innerHTML =
    '<h2>' + esc(i.designation) + '</h2>' +
    detailRow('Libelle effectivite', i.libelle) +
    detailRow('Prime MPN', i.mpn) +
    detailRow('CCN', i.ccn) +
    '<div class="modal-actions">' +
    '<button class="btn btn-delete" onclick="deleteItem(' + idx + ')">Supprimer</button>' +
    '<button class="btn btn-cancel" onclick="openEdit(' + idx + ')">Modifier</button>' +
    '<button class="btn btn-cancel" onclick="closeModal()">Fermer</button>' +
    '</div>';
  show('modalOverlay');
}

function detailRow(label, value) {
  return '<label>' + label + '</label><div style="font-size:15px;padding:6px 0;">' + esc(String(value)) + '</div>';
}

// ══════════════════════════════════════════
// MODAL: EDIT / ADD
// ══════════════════════════════════════════
function openEdit(idx) {
  var i = idx >= 0 ? ingredients[idx] : null;
  document.getElementById('modalBox').innerHTML =
    '<h2>' + (idx === -1 ? 'Nouvel ingredient' : 'Modifier') + '</h2>' +
    field('designation', 'Designation complete', i ? i.designation : '') +
    field('libelle', 'Libelle effectivite', i ? i.libelle : '') +
    field('mpn', 'Prime MPN', i ? i.mpn : '') +
    field('ccn', 'CCN', i ? i.ccn : '') +
    '<div class="error hidden" id="saveError"></div>' +
    '<div class="modal-actions">' +
    '<button class="btn btn-cancel" onclick="closeModal()">Annuler</button>' +
    '<button class="btn btn-save" id="btnSave" onclick="saveItem(' + idx + ')">Enregistrer</button>' +
    '</div>';
  show('modalOverlay');
}

function field(id, label, value) {
  return '<label>' + label + '</label><input id="edit-' + id + '" value="' + esc(String(value || '')) + '">';
}

// ══════════════════════════════════════════
// SAVE TO GOOGLE SHEET
// ══════════════════════════════════════════
function saveItem(idx) {
  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'Envoi...';

  var designation = document.getElementById('edit-designation').value.trim();
  if (!designation) {
    showError('La designation est obligatoire.');
    btn.disabled = false;
    btn.textContent = 'Enregistrer';
    return;
  }

  var params = 'action=' + (idx >= 0 ? 'update' : 'add') +
    '&designation=' + encodeURIComponent(designation) +
    '&libelle=' + encodeURIComponent(document.getElementById('edit-libelle').value.trim()) +
    '&mpn=' + encodeURIComponent(document.getElementById('edit-mpn').value.trim()) +
    '&ccn=' + encodeURIComponent(document.getElementById('edit-ccn').value.trim());

  if (idx >= 0) params += '&index=' + idx;

  fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: new URLSearchParams(params) })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.success) {
        closeModal();
        setStatus('Enregistre. Actualisation...', 'ok');
        setTimeout(loadData, 1000);
      } else {
        showError('Erreur: ' + (res.error || 'inconnue'));
        btn.disabled = false;
        btn.textContent = 'Enregistrer';
      }
    })
    .catch(function(err) {
      showError('Impossible de contacter Google Sheets.');
      btn.disabled = false;
      btn.textContent = 'Enregistrer';
    });
}

// ══════════════════════════════════════════
// DELETE FROM GOOGLE SHEET
// ══════════════════════════════════════════
function deleteItem(idx) {
  if (!confirm('Supprimer "' + ingredients[idx].designation + '" ?')) return;

  fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: new URLSearchParams('action=delete&index=' + idx) })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.success) {
        closeModal();
        setStatus('Supprime. Actualisation...', 'ok');
        setTimeout(loadData, 300);
      }
    })
    .catch(function() {
      setStatus('Erreur suppression.', 'err');
    });
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function closeModal() { hide('modalOverlay'); }

function showError(msg) {
  var el = document.getElementById('saveError');
  if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}

// ══════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(render, 150);
});
document.getElementById('btnAdd').addEventListener('click', function() { openEdit(-1); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
  if (e.ctrlKey && e.key === 'f') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});

// ══════════════════════════════════════════
// START
// ══════════════════════════════════════════
loadData();
</script>
</body>
</html>
